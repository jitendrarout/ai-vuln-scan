name: ai-vuln-scan

on:
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install
      - name: Run ai-vuln-scan
        run: node bin/ai-vuln-scan.js scan .
        # Non-zero exit (critical findings present) fails this check,
        # blocking the PR from merging until resolved or acknowledged.
